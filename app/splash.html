<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Claudagotchi</title>
  <style>
    *      { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
    body   {
      display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #eee; user-select: none; -webkit-user-select: none;
      -webkit-app-region: drag;
    }
    .card  {
      width: 320px; padding: 28px 24px;
      background: linear-gradient(160deg, #15151b 0%, #0a0a0f 100%);
      border: 1px solid #2a2a3a; border-radius: 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(124, 58, 237, 0.15);
      display: flex; flex-direction: column; align-items: center; gap: 14px;
    }
    .logo  {
      width: 160px; height: 160px; display: block;
      animation: bob 2.4s ease-in-out infinite;
    }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    .title { font-size: 18px; font-weight: 700; letter-spacing: 1px; color: #fff; }
    .tag   { font-size: 11px; color: #888; letter-spacing: 1px; text-transform: uppercase; }
    .status{
      width: 100%; min-height: 32px;
      display: flex; align-items: center; justify-content: center;
      color: #aaa; font-size: 12px; text-align: center; line-height: 1.4;
    }
    .bar   {
      width: 100%; height: 4px; background: #1a1a22; border-radius: 2px; overflow: hidden;
      display: none;
    }
    .bar.show { display: block; }
    .bar > i  {
      display: block; height: 100%; background: linear-gradient(90deg, #6c63ff, #a855f7);
      width: 30%; animation: slide 1.6s ease-in-out infinite;
    }
    @keyframes slide {
      0%   { width: 10%; margin-left: 0%; }
      50%  { width: 50%; margin-left: 25%; }
      100% { width: 10%; margin-left: 90%; }
    }
    .err   { color: #ff8d8d; font-size: 11px; padding: 6px 10px; background: #1a0808; border-radius: 6px; display: none; }
    .err.show { display: block; }
    .actions { display: none; gap: 6px; -webkit-app-region: no-drag; }
    .actions.show { display: flex; }
    .btn   {
      padding: 6px 14px; font-size: 11px; border-radius: 6px; cursor: pointer;
      background: #6c63ff; color: #fff; border: none; font-family: inherit;
    }
    .btn.quiet { background: transparent; color: #888; border: 1px solid #2a2a2a; }
  </style>
</head>
<body>
  <div class="card">
    <!-- Inline SVG splash mark with EXPLICIT width/height attributes. Without
         them, Electron's renderer collapses viewBox-only SVGs to 0×0 even
         when CSS sets a size — that's what made the egg invisible before. -->
    <svg class="logo" width="160" height="160" viewBox="0 0 100 100"
         xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
      <defs>
        <radialGradient id="eggGrad" cx="40%" cy="35%">
          <stop offset="0%"  stop-color="#fff" stop-opacity="0.7" />
          <stop offset="100%" stop-color="#a855f7" />
        </radialGradient>
      </defs>
      <ellipse cx="50" cy="55" rx="32" ry="40" fill="url(#eggGrad)" stroke="#3a1a55" stroke-width="1.5" />
      <circle cx="38" cy="40" r="3.5" fill="#fff" opacity="0.5" />
      <circle cx="60" cy="48" r="2.5" fill="#fff" opacity="0.4" />
      <circle cx="44" cy="62" r="3"   fill="#fff" opacity="0.45" />
      <path d="M 24 50 L 32 46 L 36 52 L 44 47 L 50 53 L 58 48 L 64 53 L 72 49 L 76 54"
            fill="none" stroke="#3a1a55" stroke-width="1.2" stroke-linecap="round" />
      <g fill="#ffd166">
        <circle cx="18" cy="22" r="1.8" />
        <circle cx="84" cy="30" r="1.4" />
        <circle cx="82" cy="78" r="1.6" />
        <circle cx="14" cy="74" r="1.2" />
      </g>
    </svg>
    <div class="title">CLAUDAGOTCHI</div>
    <div class="tag">claude code with a soul</div>
    <div id="status" class="status">Starting up…</div>
    <div id="bar" class="bar"><i></i></div>
    <div id="err" class="err"></div>
    <div id="actions" class="actions">
      <button class="btn" id="btn-retry">Retry</button>
      <button class="btn quiet" id="btn-skip">Skip</button>
      <button class="btn quiet" id="btn-quit">Quit</button>
    </div>
  </div>
  <script>
    const statusEl = document.getElementById('status');
    const barEl    = document.getElementById('bar');
    const errEl    = document.getElementById('err');
    const actionsEl= document.getElementById('actions');
    document.getElementById('btn-retry').onclick = () => window.cgsplash?.retry?.();
    document.getElementById('btn-skip').onclick  = () => window.cgsplash?.skip?.();
    document.getElementById('btn-quit').onclick  = () => window.cgsplash?.quit?.();
    window.cgsplash?.onStatus?.((payload) => {
      const { text, busy, err, actions } = payload || {};
      if (text !== undefined) statusEl.textContent = text;
      barEl.classList.toggle('show', !!busy);
      if (err) { errEl.textContent = err; errEl.classList.add('show'); }
      else { errEl.classList.remove('show'); errEl.textContent = ''; }
      actionsEl.classList.toggle('show', !!actions);
    });
  </script>
</body>
</html>
