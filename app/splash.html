<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Claudigotchi</title>
  <style>
    *      { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { width: 100%; height: 100%; background: transparent; overflow: hidden; }
    body   {
      display: flex; align-items: center; justify-content: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #eee; user-select: none; -webkit-user-select: none;
      -webkit-app-region: drag;   /* allow dragging the splash */
    }
    .card  {
      width: 320px; padding: 28px 24px;
      background: linear-gradient(160deg, #15151b 0%, #0a0a0f 100%);
      border: 1px solid #2a2a3a; border-radius: 18px;
      box-shadow: 0 20px 60px rgba(0,0,0,0.6), 0 0 0 1px rgba(124, 58, 237, 0.15);
      display: flex; flex-direction: column; align-items: center; gap: 14px;
    }
    .logo  {
      width: 160px; height: 160px; display: block;
      animation: bob 2.4s ease-in-out infinite;
    }
    @keyframes bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-4px); } }
    .title { font-size: 18px; font-weight: 700; letter-spacing: 1px; color: #fff; }
    .tag   { font-size: 11px; color: #888; letter-spacing: 1px; text-transform: uppercase; }
    .status{
      width: 100%; min-height: 32px;
      display: flex; align-items: center; justify-content: center;
      color: #aaa; font-size: 12px; text-align: center; line-height: 1.4;
    }
    .bar   {
      width: 100%; height: 4px; background: #1a1a22; border-radius: 2px; overflow: hidden;
      display: none;
    }
    .bar.show { display: block; }
    .bar > i  {
      display: block; height: 100%; background: linear-gradient(90deg, #6c63ff, #a855f7);
      width: 30%; animation: slide 1.6s ease-in-out infinite;
    }
    @keyframes slide {
      0%   { width: 10%; margin-left: 0%; }
      50%  { width: 50%; margin-left: 25%; }
      100% { width: 10%; margin-left: 90%; }
    }
    .err   { color: #ff8d8d; font-size: 11px; padding: 6px 10px; background: #1a0808; border-radius: 6px; display: none; }
    .err.show { display: block; }
    .actions { display: none; gap: 6px; -webkit-app-region: no-drag; }
    .actions.show { display: flex; }
    .btn   {
      padding: 6px 14px; font-size: 11px; border-radius: 6px; cursor: pointer;
      background: #6c63ff; color: #fff; border: none; font-family: inherit;
    }
    .btn.quiet { background: transparent; color: #888; border: 1px solid #2a2a2a; }
  </style>
</head>
<body>
  <div class="card">
    <img class="logo" src="public/logo.svg" alt="" onerror="this.style.display='none'" />
    <div class="title">CLAUDIGOTCHI</div>
    <div class="tag">claude code with a soul</div>
    <div id="status" class="status">Starting up…</div>
    <div id="bar" class="bar"><i></i></div>
    <div id="err" class="err"></div>
    <div id="actions" class="actions">
      <button class="btn" id="btn-retry">Retry</button>
      <button class="btn quiet" id="btn-skip">Skip</button>
      <button class="btn quiet" id="btn-quit">Quit</button>
    </div>
  </div>

  <script>
    const statusEl  = document.getElementById('status');
    const barEl     = document.getElementById('bar');
    const errEl     = document.getElementById('err');
    const actionsEl = document.getElementById('actions');

    function setStatus({ text, busy, error }) {
      if (text != null) statusEl.textContent = text;
      barEl.classList.toggle('show', !!busy);
      if (error) { errEl.textContent = error; errEl.classList.add('show'); actionsEl.classList.add('show'); }
      else       { errEl.classList.remove('show'); actionsEl.classList.remove('show'); }
    }

    document.getElementById('btn-retry').addEventListener('click', () => window.splash?.retry());
    document.getElementById('btn-skip').addEventListener('click',  () => window.splash?.skip());
    document.getElementById('btn-quit').addEventListener('click',  () => window.splash?.quit());

    if (window.splash?.onStatus) window.splash.onStatus(setStatus);
    else setStatus({ text: 'IPC unavailable.', error: 'preload not loaded' });
  </script>
</body>
</html>
